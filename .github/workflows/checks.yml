name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run regression tests
        run: npm run test:unit

      - name: Run local API suites
        run: npm run test:api:local

  chrome-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome and system dependencies
        run: npx playwright install --with-deps chrome

      - name: Run Chrome browser tests
        id: smoke
        run: npm run test:pw -- --project="Google Chrome"

      - name: Upload failure report
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-smoke-report
          path: playwrightTestRunner/html-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Run Cucumber browser tests
        id: cucumber
        if: ${{ !cancelled() && (steps.smoke.outcome == 'success' || steps.smoke.outcome == 'failure') }}
        run: npm run test:local
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome

      - name: Upload Cucumber failure report
        if: failure() && steps.cucumber.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cucumber-chrome-report
          path: cucumber-report.html
          retention-days: 7
          if-no-files-found: warn
